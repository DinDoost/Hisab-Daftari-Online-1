      if(!cloudUser) await ensureCloudUser();
      if(cloudUser){ lkUnlock(); refreshCloudQuiet(); return; }
      /* اگر قبلاً وارد شده‌اید، با PIN درست همیشه باز شود (حتی اگر نشست ابری با VPN/اینترنت ضعیف خوانده نشد) */
      if(S.loggedIn && S.email){ lkUnlock(); return; }
      LK.mode = 'login'; LK.f.mail = ''; LK.f.pass = ''; LK.buf = '';
      LK.err = 'نشست حساب ابری پایان یافته است. با ایمیل و رمز حساب وارد شوید.';
      renderLock(); return;
    }
    LK.err = 'رمز اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock(); return;
  }
  if(LK.mode === 'verify'){
    const mail = LK.purpose === 'signup' ? LK.pend?.mail : LK.f.mail;
    const type = LK.purpose === 'signup' ? 'signup' : 'recovery';
    const { data, error } = await supabaseClient.auth.verifyOtp({ email:mail, token:LK.buf, type });
    if(error){ LK.err = 'کُد نادرست یا منقضی شده است. دوباره تلاش کنید.'; LK.buf = ''; LK.shake = true; renderLock(); return; }
    LK.buf = ''; LK.err = ''; cloudUser = data.user || data.session?.user || null;
    if(!cloudUser){ LK.err = 'تأیید انجام شد، اما حساب کاربری دریافت نشد. دوباره وارد شوید.'; LK.mode = 'login'; renderLock(); return; }
    if(LK.purpose === 'signup'){
      S.email = cloudUser.email || mail; S.loggedIn = true;
      delete S.passHash; delete S.reg;
      cloudReady = true;
      const synced = await cloudSyncNow();
      if(!synced){ LK.err = 'حساب تأیید شد، اما ذخیره اولیه اطلاعات انجام نشد. تنظیمات دیتابیس را بررسی کنید.'; renderLock(); return; }
      LK.f = { mail:S.email, pass:'', pass2:'' };
      resetToList();
      return lkUnlock();
    }
    try{ await cloudLoad(); cloudReady = true; devRegister().finally(() => { DEV_AT = 0; loadDevices(); usageRefresh(); }); }
    catch(e){ LK.err = 'دریافت اطلاعات حساب انجام نشد. اتصال اینترنت را بررسی کنید.'; renderLock(); return; }
    LK.recoveryVerified = true; recClear();
    LK.mode = 'newpass'; LK.f.pass = ''; LK.f.pass2 = ''; renderLock(); return;
  }
  if(LK.mode === 'chgOff'){
    if(LK.buf === S.pin){ delete S.pin; save(); LK.newPin = ''; return lkUnlock(); }
    LK.err = 'رمز فعلی اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock(); return;
  }
  if(LK.mode === 'chg0'){
    if(LK.buf === S.pin){ LK.mode = 'setup1'; LK.buf = ''; LK.err = ''; renderLock(); return; }
    LK.err = 'رمز فعلی اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock(); return;
  }
  if(LK.mode === 'setup1'){
    LK.newPin = LK.buf; LK.buf = ''; LK.mode = 'setup2'; LK.err = ''; renderLock(); return;
  }
  if(LK.mode === 'setup2'){
    if(LK.buf === LK.newPin){ S.pin = LK.buf; save(); LK.newPin = ''; return lkUnlock(); }
    LK.err = 'رمزها یکسان نیستند. دوباره انتخاب کنید.';
    LK.buf = ''; LK.newPin = ''; LK.mode = 'setup1'; renderLock(); return;
  }
  if(LK.mode === 'recover'){
    if(LK.buf === LK.recCode){
      LK.recCode = ''; delete S.pin; save();
      LK.mode = 'setup1'; LK.buf = ''; LK.showPad = true;
      LK.err = 'رمز جدید را انتخاب کنید.'; renderLock(); return;
    }
    LK.err = 'کد اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock();
  }
}
async function hashPw(mail, pw){
  try{
    const b = new TextEncoder().encode('hd1|' + pw);
    const h = await crypto.subtle.digest('SHA-256', b);
    return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
  }catch(e){ return 'p:' + btoa(unescape(encodeURIComponent(pw))); }
}

/* ---------- مصرف Supabase: همه موارد یکجا (کارتی، مناسب گوشی) ---------- */
/* src: db/storage/users = از SQL (دقیق)، local = تخمین همین گوشی */
const USAGE_CAPS = [
  { k:'db',   n:'اندازهٔ پایگاه داده',  capTxt:'۵۰۰ مگابایت',  capVal:500,   mode:'size'  },
  { k:'stor', n:'فضای فایل‌ها (عکس‌ها)', capTxt:'۱ گیگابایت',   capVal:1024,  mode:'size'  },
  { k:'usr',  n:'کاربران',               capTxt:'۵۰٬۰۰۰',       capVal:50000, mode:'count' },
];
function usageGet(){
  try{ return JSON.parse(localStorage.getItem('hisab-usage-v1') || '{}'); }catch(e){ return {}; }
}
function usageSet(v){ try{ localStorage.setItem('hisab-usage-v1', JSON.stringify(v)); }catch(e){} }
async function usageRefresh(){
  if(!supabaseClient || !cloudUser || !navigator.onLine) return false;
  try{
    const u = usageGet();
    let ok = false;
    const r = await withTimeoutSoft(supabaseClient.rpc('usage_stats'), 10000);
    if(r && !r.error && r.data){
      const d = typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
      if(d.db != null) u.db = Number(d.db) / 1048576;
      if(d.storage != null) u.stor = Number(d.storage) / 1048576;
      if(d.users != null) u.usr = Number(d.users);
      if(d.conn != null) u.conn = Number(d.conn);
      ok = true;
    }else{
      const r2 = await withTimeoutSoft(supabaseClient.rpc('usage_db_size'), 10000);
      if(r2 && !r2.error && r2.data != null){ u.db = Number(r2.data) / 1048576; ok = true; }
    }
    if(ok){ u.at = new Date().toISOString(); usageSet(u); }
    return ok;
  }catch(e){ return false; }
}
function phFa(s){ return String(s == null ? '' : s).replace(/\d/g, x => '۰۱۲۳۴۵۶۷۸۹'[x]); }
function fa(n, d){ return (Number(n) || 0).toLocaleString('fa-IR', { maximumFractionDigits: d }); }
function usageSizeTxt(mb){
  if(mb >= 1024) return fa(mb / 1024, 2) + ' گیگابایت';
  if(mb < 1) return fa(mb * 1024, 0) + ' کیلوبایت';
  return fa(mb, 2) + ' مگابایت';
}
/* مقدار دقیق‌تر زیر عدد اصلی: کیلوبایت (یا بایت وقتی کمتر از ۱ مگابایت است) */
function usageExactTxt(mb){
  if(mb < 1) return fa(mb * 1048576, 0) + ' بایت';
  return fa(mb * 1024, 0) + ' کیلوبایت';
}
function usageItems(){
  const u = usageGet();
  return USAGE_CAPS.map((c, i) => {
    const raw = u[c.k] == null ? null : Number(u[c.k]);
    const has = raw != null && !isNaN(raw);
    const pct = has && c.capVal ? (raw / c.capVal) * 100 : 0;
    const col = pct >= 90 ? '#c0392b' : pct >= 70 ? '#d98a00' : '#1e9e62';
    let used = '—', kb = '', rem = '—', remKb = '';
    if(has){
      const left = Math.max(0, c.capVal - raw);
      if(c.mode === 'size'){
        used = usageSizeTxt(raw); kb = usageExactTxt(raw);
        rem = usageSizeTxt(left); remKb = usageExactTxt(left);
      }else{
        used = fa(raw, 0); rem = fa(left, 0);
      }
    }
    const pTxt = !has ? '—' : (pct > 0 && pct < 0.01 ? 'کمتر از ۰٫۰۱٪' : fa(pct, 2) + '٪');
    return { name: fa(i+1,0) + '. ' + c.n, pct, col, used, kb, cap: c.capTxt, rem, remKb, pTxt };
  });
}
function usageRowsHTML(){
  const u = usageGet();
  const rows = usageItems().map(it => `<div class="u-card">
      <div class="u-top"><b>${esc(it.name)}</b><span class="u-pct" style="color:${it.col};background:${it.col}1a">${it.pTxt}</span></div>
      <div class="u-bar"><i style="width:${Math.max(it.pct > 0 ? 1.5 : 0, Math.min(100, it.pct))}%;background:${it.col}"></i></div>
      <div class="u-grid">

      </div>
    </div>`).join('');
  const at = u.at ? new Date(u.at).toLocaleDateString('fa-IR') + ' · ' + new Date(u.at).toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '—';

/* اشتراک جدول مصرف به شکل عکس یا PDF؛ همان رنگ‌های سبز/نارنجی/قرمز */
async function usageShare(asPdf){
  const m = document.getElementById('usagemenu'); if(m) m.classList.add('hidden');
  const items = usageItems();
  const font = 'Vazirmatn, Tahoma, sans-serif';
  try{ await document.fonts.load('bold 16px Vazirmatn'); await document.fonts.load('600 14px Vazirmatn'); await document.fonts.load('14px Vazirmatn'); }catch(e){}
  const W = 800, PAD = 40, GAP = 16, TOP = 110;
  const cardH = it => 24 + 30 + 14 + 10 + 22 + 20 + 30 + (it.kb ? 22 : 0) + 14;
  const H = TOP + items.reduce((a, it) => a + cardH(it) + GAP, 0) + 70;
  const Q = 2, cv = document.createElement('canvas');
  cv.width = W * Q; cv.height = H * Q;
  const x = cv.getContext('2d');
  x.scale(Q, Q); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  try{ x.direction = 'rtl'; }catch(e){}
  x.textBaseline = 'middle';
  x.fillStyle = '#f3f6fa'; x.fillRect(0, 0, W, H);
  const rr = (X, Y, w, h, r) => {
    x.beginPath(); x.moveTo(X + r, Y); x.lineTo(X + w - r, Y); x.quadraticCurveTo(X + w, Y, X + w, Y + r);
    x.lineTo(X + w, Y + h - r); x.quadraticCurveTo(X + w, Y + h, X + w - r, Y + h);
    x.lineTo(X + r, Y + h); x.quadraticCurveTo(X, Y + h, X, Y + h - r);
    x.lineTo(X, Y + r); x.quadraticCurveTo(X, Y, X + r, Y); x.closePath();
  };
  /* عنوان */
  x.textAlign = 'right'; x.fillStyle = '#1f2937'; x.font = `bold 28px ${font}`;
  x.fillText('مصرف و سقف برنامه', W - PAD, 52);
  const nowD = new Date();
  x.textAlign = 'left'; x.fillStyle = '#64748b'; x.font = `14px ${font}`;
  x.fillText(nowD.toLocaleDateString('fa-IR') + '  ' + nowD.toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' }), PAD, 52);
  x.textAlign = 'right'; x.fillStyle = '#64748b'; x.font = `14px ${font}`;
  x.fillText('Supabase', W - PAD, 84);
  let y = TOP;
  const innerW = W - PAD * 2 - 40, colW = innerW / 3, rightEdge = W - PAD - 20;
  items.forEach(it => {
    const h = cardH(it);
    x.fillStyle = '#ffffff'; rr(PAD, y, W - PAD * 2, h, 18); x.fill();
    x.strokeStyle = '#dfe3ea'; x.lineWidth = 1; rr(PAD, y, W - PAD * 2, h, 18); x.stroke();
    let cy = y + 24 + 15;
    x.textAlign = 'right'; x.fillStyle = '#1f2937'; x.font = `bold 18px ${font}`;
    x.fillText(it.name, W - PAD - 20, cy);
    x.textAlign = 'left'; x.fillStyle = it.col; x.font = `bold 16px ${font}`;
    x.fillText(it.pTxt, PAD + 20, cy);
    cy += 15 + 14 + 5;
    x.fillStyle = '#e6edf8'; rr(PAD + 20, cy - 5, innerW, 10, 5); x.fill();
    const fw = Math.max(0, Math.min(100, it.pct)) / 100 * innerW;
    if(fw > 0){ x.fillStyle = it.col; rr(W - PAD - 20 - Math.max(fw, 10), cy - 5, Math.max(fw, 10), 10, 5); x.fill(); }
    cy += 5 + 20;
    const cols = [['مصرف', it.used, it.kb], ['سقف', it.cap, ''], ['باقی‌مانده', it.rem, it.remKb]];
    cols.forEach((cl, i) => {
      const cx = rightEdge - colW * (i + 0.5);
      x.textAlign = 'center'; x.fillStyle = '#64748b'; x.font = `14px ${font}`;
      x.fillText(cl[0], cx, cy);
      x.fillStyle = '#1f2937'; x.font = `600 17px ${font}`;
      x.fillText(String(cl[1]), cx, cy + 28);
      if(cl[2]){ x.fillStyle = '#64748b'; x.font = `13px ${font}`; x.fillText(cl[2], cx, cy + 52); }
    });
    y += h + GAP;
  });
  x.textAlign = 'right'; x.fillStyle = '#64748b'; x.font = `14px ${font}`;
  x.fillText('ساخته شده با حساب دفتری', W - PAD, H - 30);
  cv.toBlob(async jpg => {
    if(!jpg){ showToast('ساخت فایل انجام نشد'); return; }
    let file, blobOut;
    if(asPdf){
      const bytes = new Uint8Array(await jpg.arrayBuffer());
      const pdf = jpegToPdf(bytes, W, H, cv.width, cv.height);
      file = new File([pdf], 'مصرف و سقف.pdf', { type: 'application/pdf' }); blobOut = pdf;
    }else{
      file = new File([jpg], 'مصرف و سقف.jpg', { type: 'image/jpeg' }); blobOut = jpg;
    }
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], title: 'مصرف و سقف برنامه' }); return; }catch(e){ return; }
    }
    const url = URL.createObjectURL(blobOut);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/jpeg', 0.92);
}

let DEV_BUSY = false;
let LOGIN_AT = 0;
/* هر ویرایش ردیف در پایگاه داده نسخهٔ قدیمی آن را پر از اطلاعات زائد می‌کند و حجم بالا می‌رود؛ پس زمان آخرین فعالیت را حداکثر هر ۳۰ دقیقه یک بار می‌نویسیم */
function devSeenDue(uid, did){
  try{
    const k = 'hisab-seen-' + uid + '-' + did;
    const last = Number(localStorage.getItem(k) || 0);
    if(Date.now() - last < 30 * 60 * 1000) return false;
    localStorage.setItem(k, String(Date.now()));
    return true;
  }catch(e){ return true; }
}
/* بعد از ورود با ایمیل و رمز، این دستگاه همیشه دوباره ثبت می‌شود */
async function devRegister(){
  LOGIN_AT = Date.now();
  if(!supabaseClient || !cloudUser || !navigator.onLine) return;
  const uid = cloudUser.id, did = getDeviceId(), nm = devName(), flag = 'hisab-dev-reg-' + uid;
  try{
    const sel = await supabaseClient.from('user_devices').select('device_id').eq('u', uid).eq('device_id', did);
    if(!sel.error && sel.data && sel.data.length){
      if(devSeenDue(uid, did)) await supabaseClient.from('user_devices').update({ name:nm, last_seen:new Date().toISOString() }).eq('u', uid).eq('device_id', did);
    } else {
      await supabaseClient.from('user_devices').insert({ u:uid, device_id:did, name:nm });
    }
    try{ localStorage.setItem(flag, '1'); }catch(e){}
  }catch(e){ console.warn('device register:', e); }
}
async function devSync(){
  if(DEV_BUSY || !supabaseClient || !cloudUser || !navigator.onLine) return;
  DEV_BUSY = true;
  try{
    const uid = cloudUser.id, did = getDeviceId(), nm = devName();
    const flag = 'hisab-dev-reg-' + uid;
    const sel = await supabaseClient.from('user_devices').select('device_id').eq('u', uid);
    if(sel.error || !sel.data) return;
    const ids = sel.data.map(r => r.device_id);
    if(ids.includes(did)){
      try{ localStorage.setItem(flag, '1'); }catch(e){}
      if(devSeenDue(uid, did)) await supabaseClient.from('user_devices').update({ name:nm, last_seen:new Date().toISOString() }).eq('u', uid).eq('device_id', did);
      return;
    }
    if(!localStorage.getItem(flag) || ids.length === 0){
      const ins = await supabaseClient.from('user_devices').insert({ u:uid, device_id:did, name:nm });
      if(!ins.error){ try{ localStorage.setItem(flag, '1'); }catch(e){} }
      return;
    }
    /* لیست دیده می‌شود، دستگاه‌های دیگر در آن هستند، ولی ردیف این دستگاه نیست: این دستگاه حذف شده است */
    if(Date.now() - LOGIN_AT < 60000) return;
    await deviceRevoked();
  }catch(e){ console.warn('device sync:', e); }
  finally{ DEV_BUSY = false; }
}

  const t = today();

      <button type="button" class="cal-ok" data-a="calOk">تأیید تاریخ</button>

    const lo = Math.min(t.y - 10, CAL.sel.y), hi = Math.max(t.y + 5, CAL.sel.y);

      ys += `<button type="button" class="${y === CAL.vy ? 'sel' : ''}" data-a="calYear" data-v="${y}">${fa(y)}</button>`;
    }

        <div class="cal-years">${ys}</div>
        ${foot}
      </div>`;
    return;
  }

  const dim = daysIn(CAL.vy, CAL.vm);
  const first = (jToDate(CAL.vy, CAL.vm, 1).getDay() + 1) % 7;
  let g = '';
  for(let i = 0; i < first; i++) g += '<span class="blank"></span>';
  for(let d = 1; d <= dim; d++){
    const isSel = CAL.sel.y === CAL.vy && CAL.sel.m === CAL.vm && CAL.sel.d === d;
    g += `<button type="button" class="${isSel ? 'sel' : ''}" data-a="calDay" data-v="${d}">${fa(d)}</button>`;
  }
  el.innerHTML = `

        <button type="button" class="cal-nav" data-a="calPrev" aria-label="ماه قبل">‹</button>

      <div class="cal-grid">${g}</div>
      ${foot}
    </div>`;
}

/* ---------- events ---------- */
/* long press (1 second) on a card shows edit / delete buttons */
/* Hold for one second: the card starts shaking after a short moment,
   and at one second the edit/delete buttons appear. Lifting the finger
   or moving it early cancels the hold. */
let LPEL = null, LPS = null, LPY = 0;
function lpStart(e){
  LPJUST = false;
  clearTimeout(LPT); clearTimeout(LPS);
  if(LPEL){ LPEL.classList.remove('shaking'); LPEL = null; }
  const el = e.target && e.target.closest ? e.target.closest('[data-lp]') : null;
  if(!el) return;
  LPEL = el;
  LPY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  LPS = setTimeout(() => el.classList.add('shaking'), 350);
  LPT = setTimeout(() => {
    const key = el.dataset.lp;
    const [kind, pid, cid, tid] = key.split(':');
    LPJUST = true;
    LPEL = null;
    LPSEL = { key, view: V.view, kind, pid, cid, tid };
    render();
    if(navigator.vibrate) navigator.vibrate(20);
  }, el.dataset.hold ? parseInt(el.dataset.hold, 10) : 1000);
}
function lpCancel(){
  clearTimeout(LPT); clearTimeout(LPS);
  if(LPEL){ LPEL.classList.remove('shaking'); LPEL = null; }
}
document.addEventListener('touchstart', lpStart, {passive:true});
document.addEventListener('mousedown', lpStart);
['touchend','touchcancel','touchmove','mouseup'].forEach(ev => document.addEventListener(ev, lpCancel, {passive:true}));
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-lp]')) e.preventDefault(); });

let PHOTO = null;          /* pending photo: {blob, url} */
let PHOTO_DEL = false;     /* the customer's photo is to be removed when saved */
let CROP = null;           /* crop state while the crop sheet is open */
const CROP_S = 260;        /* crop square size in px */
const AVATAR_MAX = 5 * 1024;

function avatarPickHTML(src){
  return `<button class="avatar-big avatar-btn" data-a="pickPhoto" aria-label="انتخاب عکس">${src ? `<img src="${esc(src)}" alt="">` : ICON.user}<span class="cam-badge"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>`;

    : `<span class="av" style="background:${col[0]};color:${col[1]}">${esc(c.n.charAt(0))}</span>`;

function onPhotoChosen(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('فقط فایل عکس انتخاب کنید.'); return; }
  const img = new Image();
  img.onload = () => {
    CROP = { img, zoom:1, x:0, y:0 };
    openSheet(`
      <div class="sh-h"><span>برش عکس</span><button class="ic" data-a="close" aria-label="بستن">${ICON.close}</button></div>
      <div class="crop-wrap"><canvas id="crop-cv" width="${CROP_S}" height="${CROP_S}"></canvas></div>
      <div class="hint">عکس را با انگشت جابه‌جا کنید و با نوار زیر بزرگ‌نمایی کنید.</div>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" aria-label="بزرگ‌نمایی">
      <button class="btn pri-btn" data-a="cropOk">تأیید عکس</button>`);
    const cv = document.getElementById('crop-cv');
    const zoom = document.getElementById('crop-zoom');
    centerCrop(); drawCrop();
    let drag = null;
    cv.addEventListener('pointerdown', e => {
      drag = { px:e.clientX, py:e.clientY, x:CROP.x, y:CROP.y };
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
      if(!drag || !CROP) return;
      const k = CROP_S / cv.getBoundingClientRect().width;
      CROP.x = drag.x + (e.clientX - drag.px) * k;
      CROP.y = drag.y + (e.clientY - drag.py) * k;
      drawCrop();
    });
    const endDrag = () => { drag = null; };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    zoom.addEventListener('input', () => setZoom(parseFloat(zoom.value)));
  };
  img.onerror = () => alert('این فایل عکس باز نشد.');
  img.src = URL.createObjectURL(file);
}
function cropScale(){
  return Math.max(CROP_S / CROP.img.width, CROP_S / CROP.img.height) * CROP.zoom;
}
function clampCrop(){
  const sc = cropScale(), w = CROP.img.width * sc, h = CROP.img.height * sc;
  CROP.x = Math.min(0, Math.max(CROP_S - w, CROP.x));
  CROP.y = Math.min(0, Math.max(CROP_S - h, CROP.y));
}
function centerCrop(){
  const sc = cropScale();
  CROP.x = (CROP_S - CROP.img.width * sc) / 2;
  CROP.y = (CROP_S - CROP.img.height * sc) / 2;
  clampCrop();
}
function setZoom(z){
  const oldSc = cropScale();
  const cx = (CROP_S / 2 - CROP.x) / oldSc, cy = (CROP_S / 2 - CROP.y) / oldSc;
  CROP.zoom = z;
  const sc = cropScale();
  CROP.x = CROP_S / 2 - cx * sc;
  CROP.y = CROP_S / 2 - cy * sc;
  clampCrop(); drawCrop();
}
function drawCrop(){
  const cv = document.getElementById('crop-cv');
  if(!cv || !CROP) return;
  const ctx = cv.getContext('2d'), sc = cropScale();
  clampCrop();
  ctx.clearRect(0, 0, CROP_S, CROP_S);
  ctx.drawImage(CROP.img, CROP.x, CROP.y, CROP.img.width * sc, CROP.img.height * sc);
}
async function encodeAvatar(){
  const sc = cropScale(), side = CROP_S / sc;
  const sx = -CROP.x / sc, sy = -CROP.y / sc;
  let last = null;
  for(const size of [160, 128, 112, 96]){
    const out = document.createElement('canvas');
    out.width = out.height = size;
    out.getContext('2d').drawImage(CROP.img, sx, sy, side, side, 0, 0, size, size);
    for(const q of [0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2]){
      const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', q));
      if(blob){
        last = blob;
        if(blob.size <= AVATAR_MAX) return blob;
      }
    }
  }
  return last;
}
async function uploadAvatar(blob, cid){
  const path = `${cloudUser.id}/${String(cid).replace(/[^A-Za-z0-9_-]/g, '_')}.jpg`;
  const bucket = supabaseClient.storage.from('avatars');
  const { error } = await bucket.upload(path, blob, { upsert:true, contentType:'image/jpeg', cacheControl:'3600' });
  if(error) throw error;
  return bucket.getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
}

    if(error){ console.error('phone check error:', error); return false; }

let KA = { t:null, state:'idle' };   /* idle | loading | ok | none | err */
function kaFmt(iso){

/* دکمهٔ قرمز: دستی دوباره به سرور وصل می‌شود */
async function kaRetry(){
  KA_AT = 0; KA_BUSY = false;
  KA.state = 'loading'; kaPaint();
  let why = '';
  try{
    if(!navigator.onLine){ why = 'اینترنت گوشی قطع است. اینترنت را روشن کنید.'; throw new Error(why); }
    /* اگر کتابخانهٔ Supabase در بار اول بارگذاری نشده، همین‌جا دوباره تلاش می‌کنیم */
    if(!supabaseClient){
      for(const src of SUPA_SOURCES){
        try{ await loadScriptOnce(src); }catch(e){ continue; }
        makeSupabaseClient();
        if(supabaseClient) break;
      }
      if(!supabaseClient){ why = 'اتصال به سرور برقرار نشد. اینترنت را بررسی کنید.'; throw new Error(why); }
    }
    await ensureCloudUser();
    if(!cloudUser){ why = 'نشست حساب پیدا نشد. یک بار از حساب خارج و دوباره وارد شوید.'; throw new Error(why); }
    /* اتصال زنده را از نو برقرار می‌کنیم */
    if(LIVE_CH){ try{ supabaseClient.removeChannel(LIVE_CH); }catch(e){} }
    LIVE_CH = null; LIVE_UID = null; LIVE_OK = false;
    await cloudLoad();
    cloudReady = true;
    startLive();
    devSync();
  }catch(e){
    console.warn('manual reconnect:', e);
    if(why) showToast(why);
  }
  KA_BUSY = false;
  await kaLoad();
  updateNetDot();
  DEV_AT = 0; loadDevices();
  usageRefresh();
}

let KA_AT = 0, KA_BUSY = false;
function kaLoadOnce(){
  if(Date.now() - KA_AT < 60000) return;
  KA_AT = Date.now();
  kaLoad();
}
async function kaLoad(){
  if(KA_BUSY) return;
  KA_BUSY = true;
  if(!cloudUser) await ensureCloudUser();
  if(!navigator.onLine || !supabaseClient || !cloudUser){ KA.state = 'err'; kaPaint(); KA_BUSY = false; return; }
  /* اگر قبلاً زمان را داریم، دوباره «در حال خواندن» نشان نمی‌دهیم */
  if(!KA.t) { KA.state = 'loading'; kaPaint(); }
  try{
    const { data, error } = await supabaseClient.from('keepalive').select('last_ping').eq('id', 1).maybeSingle();
    if(error) throw error;
    if(data && data.last_ping){ KA.t = data.last_ping; KA.state = 'ok'; }
    else{ KA.t = null; KA.state = 'none'; }
  }catch(e){ console.warn('keepalive read:', e); KA.state = 'err'; }
  KA_BUSY = false;
  kaPaint();
}

function pinHash(salt, code){
  const str = salt + '|' + code;
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16);
}
function pinStream(salt, pin, n){ const k = pinHash(salt, pin); let o = ''; while(o.length < n) o += k; return o.slice(0, n); }
function pinEncode(code, salt, pin){
  const k = pinStream(salt, pin, code.length); let o = '';
  for(let i = 0; i < code.length; i++) o += (code.charCodeAt(i) ^ k.charCodeAt(i)).toString(16).padStart(4, '0');
  return o;
}
function pinDecode(enc, salt, pin){
  const n = Math.floor((enc || '').length / 4); const k = pinStream(salt, pin, n); let o = '';
  for(let i = 0; i < n; i++) o += String.fromCharCode(parseInt(enc.substr(i * 4, 4), 16) ^ k.charCodeAt(i));
  return o;
}

}
async function refreshRemembered(r){

async function portalLogin(){
  if(PORTAL.busy) return;
  const phone = latin(val('pt-phone')).replace(/\D/g, '');
  const code = latin(val('pt-code')).replace(/\D/g, '');
  PORTAL.phone = phone; PORTAL.code = code;
  if(phone.length < 10){ PORTAL.err = 'شماره موبایل را کامل وارد کنید.'; return renderPortal(); }
  if(!/^[0-9]{6}$/.test(code)){ PORTAL.err = 'کد ۶ رقمی را وارد کنید.'; return renderPortal(); }
  if(portalOwnerView()){
    const hit = S.parties.flatMap(p => p.c.map(c => ({ c }))).find(x => x.c.ac === code && (x.c.ph || '').replace(/\D/g, '') === phone);
    if(!hit){ PORTAL.err = 'شماره موبایل یا کد وارد شده درست نیست.'; PORTAL.code = ''; return renderPortal(); }
    const c = hit.c;
    PORTAL.data = { name: c.n || '', photo: c.pf || '', transactions: (c.tx || []).map(t => ({
      d: t.d || '', a: Math.trunc(Number(t.a) || 0), y: Math.trunc(Number(t.y) || 0),
      m: Math.trunc(Number(t.m) || 1), dd: Math.trunc(Number(t.dd) || 1),
      ts: Math.trunc(Number(t.ts) || 0), hh: t.hh ?? null, mm: t.mm ?? null })) };
    PORTAL.err = ''; PORTAL.code = '';
    return renderPortal();
  }
  if(!supabaseClient){ PORTAL.err = 'اتصال برقرار نیست. صفحه را تازه کنید.'; return renderPortal(); }
  PORTAL.busy = true; PORTAL.err = 'در حال بررسی...'; renderPortal();
  const { data, error } = await supabaseClient.rpc('customer_portal', { p_code: code, p_phone: phone });
  PORTAL.busy = false;
  if(error){
    const m = String(error.message || '');
    PORTAL.err = m.includes('locked') ? 'به‌دلیل تلاش‌های زیاد، ۳۰ دقیقه بعد دوباره امتحان کنید.'
      : m.includes('invalid') ? 'شماره موبایل یا کد وارد شده درست نیست.'
      : 'ورود انجام نشد: ' + m;
    PORTAL.code = '';
    return renderPortal();
  }
  savePortalPhone(phone);
  rememberPortal(phone, code, data);
  PORTAL.data = data; PORTAL.err = ''; PORTAL.code = '';
  renderPortal();
}

/* ---------- clock picker (analog, drag the hand) ---------- */
let TCK = { h24:12, mi:0, mode:'hour', open:false };
let TC_DRAG = false, TC_JUST = false;
function clockText(h, m){
  const h12 = (h % 12) || 12;
  const per = h < 12 ? 'قبل از ظهر' : 'بعد از ظهر';
  return `${h12}:${p2(m)} ${per}`;
}
function clockSVG(){
  const C = 130, R = 92;
  const pt = (deg, r) => [C + r * Math.sin(deg * Math.PI / 180), C - r * Math.cos(deg * Math.PI / 180)];
  let nums = '';
  if(TCK.mode === 'hour'){
    for(let i = 1; i <= 12; i++){
      const [x, y] = pt(i * 30, R);
      nums += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${i}</text>`;
    }
  } else {
    for(let i = 0; i < 60; i += 5){
      const [x, y] = pt(i * 6, R);
      nums += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${p2(i)}</text>`;
    }
  }
  const ang = TCK.mode === 'hour' ? ((TCK.h24 % 12) * 30) : TCK.mi * 6;
  const [hx, hy] = pt(ang, TCK.mode === 'hour' ? 66 : 84);
  return `<svg class="tc-face" id="tc-face" viewBox="0 0 260 260">
    <circle cx="130" cy="130" r="126" class="face"/>
    ${nums}
    <line x1="130" y1="130" x2="${hx}" y2="${hy}" class="hand"/>
    <circle cx="${hx}" cy="${hy}" r="17" class="knob"/>
    <circle cx="130" cy="130" r="4" class="knob"/>
  </svg>`;
}
function tclkEl(){
  let el = document.getElementById('tclk');
  if(!el){
    el = document.createElement('div');
    el.id = 'tclk'; el.className = 'overlay cal-ov hidden';
    document.body.appendChild(el);
  }
  return el;
}
function tclkRender(){
  const el = tclkEl();
  const h12 = (TCK.h24 % 12) || 12, pm = TCK.h24 >= 12;
  el.innerHTML = `<div class="tc-box">
    <div class="tc-show">
      <button type="button" class="${TCK.mode === 'hour' ? 'on' : ''}" data-a="tcHour">${h12}</button>
      <span>:</span>
      <button type="button" class="${TCK.mode === 'minute' ? 'on' : ''}" data-a="tcMin">${p2(TCK.mi)}</button>
    </div>
    <div class="tc-ampm">
      <button type="button" class="${!pm ? 'on' : ''}" data-a="tcAm">قبل از ظهر</button>
      <button type="button" class="${pm ? 'on' : ''}" data-a="tcPm">بعد از ظهر</button>
    </div>
    ${clockSVG()}
    <div class="cal-foot">
      <button type="button" class="cal-cancel" data-a="tcCancel">انصراف</button>
      <button type="button" class="cal-ok" data-a="tcOk">تأیید ساعت</button>
    </div>
  </div>`;
  el.classList.remove('hidden');
}
function hideTclk(){
  TCK.open = false;
  const el = document.getElementById('tclk');
  if(el){ el.classList.add('hidden'); el.innerHTML = ''; }
}
function closeTclk(){
  hideTclk();

function tcSetFromPoint(e, svg){
  const r = svg.getBoundingClientRect();
  const px = (e.clientX - r.left) * 260 / r.width, py = (e.clientY - r.top) * 260 / r.height;
  const deg = (Math.atan2(px - 130, -(py - 130)) * 180 / Math.PI + 360) % 360;
  if(TCK.mode === 'hour'){
    const pm = TCK.h24 >= 12;
    let h12 = Math.round(deg / 30) % 12; if(h12 === 0) h12 = 12;
    TCK.h24 = (h12 % 12) + (pm ? 12 : 0);
  } else {
    TCK.mi = Math.round(deg / 6) % 60;
  }
  tclkRender();
}
document.addEventListener('pointerdown', e => {
  const s = e.target.closest && e.target.closest('#tc-face');
  if(!s) return;
  TC_DRAG = true;
  tcSetFromPoint(e, s);
});
document.addEventListener('pointermove', e => {
  if(!TC_DRAG) return;
  const s = document.getElementById('tc-face');
  if(s) tcSetFromPoint(e, s);
});
function tcEndDrag(){
  if(!TC_DRAG) return;
  TC_DRAG = false;
  TC_JUST = true; setTimeout(() => { TC_JUST = false; }, 300);
  if(TCK.mode === 'hour'){ TCK.mode = 'minute'; tclkRender(); }
}
document.addEventListener('pointerup', tcEndDrag);

    case 'delTx':
      if(t) openSheet(SHEETS.confirmDel('tx', c.n, p, c, { id: t.id }));

function storedSessionUser(){
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k) continue;
      if(!(/^sb-.*-auth-token$/.test(k) || k === 'supabase.auth.token')) continue;
      const v = JSON.parse(localStorage.getItem(k) || 'null');
      const u = v?.user || v?.currentSession?.user;
      if(u && u.id) return u;
    }
  }catch(e){}
  return null;
}
/* نسخهٔ پشتیبان نشست روی همین گوشی: اگر کتابخانه نشست را از حافظه پاک کند، از اینجا دوباره وصل می‌شویم */
function saveSessBackup(s){
  try{ if(s && s.access_token && s.refresh_token) localStorage.setItem('hesab-sess-bk', JSON.stringify({a:s.access_token, r:s.refresh_token})); }catch(e){}
}
function clearSessBackup(){ try{ localStorage.removeItem('hesab-sess-bk'); }catch(e){} }
async function restoreSessBackup(){
  if(!supabaseClient) return null;
  let bk = null;
  try{ bk = JSON.parse(localStorage.getItem('hesab-sess-bk') || 'null'); }catch(e){}
  if(!bk || !bk.r) return null;
  try{
    const r = await withTimeoutSoft(supabaseClient.auth.setSession({ access_token:bk.a, refresh_token:bk.r }), 12000);
    const s = r?.data?.session;
    if(s){ saveSessBackup(s); return s.user || null; }
  }catch(e){}
  return null;
}
let CLOUD_TRIES = 0;
async function refreshCloudQuiet(){
  if(cloudReady) return;
  await ensureCloudUser();
  if(!cloudUser){ if(S.loggedIn && CLOUD_TRIES++ < 21) setTimeout(refreshCloudQuiet, Math.min(60000, 3000 * CLOUD_TRIES)); return; }
  /* دفترچه‌ها و تنظیم پیش‌فرض جدا از بارگذاری طرف حساب‌ها خوانده می‌شوند تا خطای یکی، بقیه را متوقف نکند */
  let ok = false;
  try{
    await cloudLoad();
    ok = true;
  }catch(e){
    console.warn('cloud refresh skipped (offline?):', e);
  }
  if(!ok){
    /* اگر بارگذاری ناموفق بود، چند بار دیگر امتحان می‌کنیم؛ چیزی را به‌عنوان «همگام‌شده» علامت نمی‌زنیم */
    if(S.loggedIn && CLOUD_TRIES++ < 21) setTimeout(refreshCloudQuiet, Math.min(60000, 3000 * CLOUD_TRIES));
    return;
  }
  try{ await nbLoad(); }catch(e){ console.warn('notebooks load:', e); }
  await prefLoadCloud();
  cloudReady = true; S.loggedIn = true;
  devSync().finally(() => { DEV_AT = 0; loadDevices(); });
  if(!liveUIBusy()) render();
  startLive();
}

/* ---------- همگام‌سازی لحظه‌ای بین گوشی‌ها (Supabase Realtime) ---------- */
let LIVE_CH = null, LIVE_T = null, LIVE_UID = null;
function startLive(){
  if(!supabaseClient || !cloudUser) return;
  if(LIVE_CH && LIVE_UID === cloudUser.id) return;
  if(LIVE_CH){ try{ supabaseClient.removeChannel(LIVE_CH); }catch(e){} }
  const uid = cloudUser.id;
  LIVE_UID = uid;
  const sub = table => ({ event:'*', schema:'public', table, filter:'u=eq.' + uid });
  try{
    LIVE_CH = supabaseClient.channel('hisab-live-' + uid)
      .on('postgres_changes', sub('p'), ev => liveApply('p', ev))
      .on('postgres_changes', sub('c'), ev => liveApply('c', ev))
      .on('postgres_changes', sub('t'), ev => liveApply('t', ev))
      .on('postgres_changes', sub('l'), ev => liveApply('l', ev))
      .on('postgres_changes', sub('nb'), liveKick)
      .on('postgres_changes', sub('ny'), liveKick)
      .on('postgres_changes', sub('s'), liveKick)
      .on('postgres_changes', sub('pref'), liveKick)
      .subscribe((st) => { LIVE_OK = st === 'SUBSCRIBED'; updateNetDot(); if(st === 'SUBSCRIBED'){ if(LIVE_SUBS++ > 0) setTimeout(() => liveRefresh(), 300); } });
  }catch(e){ console.warn('realtime:', e); }
}
function liveKick(){
  clearTimeout(LIVE_T);
  LIVE_T = setTimeout(liveRefresh, 400);
}
function liveUIBusy(){
  const ov = document.querySelector('.overlay:not(.hidden)');
  const pt = document.getElementById('portal');
  const ae = document.activeElement;
  return !!ov || (pt && !pt.classList.contains('hidden')) || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
}
/* وقتی انگشت روی صفحه است یا تازه برداشته شده، تازه‌سازی پس‌زمینه صبر می‌کند تا لیست زیر انگشت شما جابه‌جا نشود */
let TOUCHING = false, TOUCH_T = 0;
document.addEventListener('touchstart', () => { TOUCHING = true; }, { passive:true });
['touchend','touchcancel'].forEach(ev => document.addEventListener(ev, () => { TOUCHING = false; TOUCH_T = Date.now(); }, { passive:true }));
let LIVE_SUBS = 0;
let LIVE_Q = Promise.resolve();
/* تغییرات زنده را یکی‌یکی و به ترتیب اعمال می‌کند؛ فقط همان ردیف را نگه می‌دارد و کل داده‌ها را دوباره نمی‌خواند */
function liveApply(tb, ev){
  LIVE_Q = LIVE_Q.then(() => liveApplyNow(tb, ev)).catch(e => console.warn('live apply:', e));
}
function liveFallback(){ return liveRefresh(); }
function liveScheduleRender(){
  if(liveUIBusy() || LK.locked){ setTimeout(liveScheduleRender, 2000); return; }
  render();
}
function txFromRow(r){
  return { id:r.id, a:Number(r.a)||0, d:r.d||'', y:Number(r.y)||0, m:Number(r.m)||1, dd:Number(r.dd)||1, ts:Number(r.ts)||0,
    hh: r.hh == null ? undefined : Number(r.hh), mm: r.mm == null ? undefined : Number(r.mm) };
}
function ledgerFromRow(r){
  return { id:r.id, type: r.ty === 'out' ? 'out' : 'in', a:Number(r.a)||0, d:r.d||'', y:Number(r.y)||0, m:Number(r.m)||1, dd:Number(r.dd)||1, ts:Number(r.ts)||0,
    hh: r.hh == null ? null : Number(r.hh), mm: r.mm == null ? null : Number(r.mm) };
}
async function liveApplyNow(tb, ev){
  if(!supabaseClient || !cloudUser || !SYNC_SNAP) return liveFallback();
  if(tb === 'l' && !ledgerCloudOk) return;
  const u = cloudUser.id;
  const isDel = ev.eventType === 'DELETE';
  const row = isDel ? ev.old : ev.new;
  if(!row || row.id == null) return;
  const id = String(row.id);
  /* حذف حساب یا مشتری ممکن است زیرمجموعه‌ها را هم ببرد؛ در این مورد یک‌بار کامل می‌خوانیم */
  if(isDel && (tb === 'p' || tb === 'c')) return liveFallback();
  const prev = SYNC_SNAP[tb] || new Map();
  const prevJ = prev.get(id);
  /* اگر همین گوشی تغییر تازه‌ای دارد که هنوز فرستاده نشده، آن را روی داده‌های خارجی بازنویسی نمی‌کنیم */
  const localNow = (cloudRowsFor(u)[tb] || []).find(r => String(r.id) === id);
  const localJ = localNow ? JSON.stringify(localNow) : undefined;
  if(localJ !== prevJ) return;

  if(tb === 'p'){
    const ex = (S.parties || []).find(x => String(x.id) === id);
    if(ex){ ex.n = row.n || ''; ex.cur = row.cur || 'toman'; }
    else (S.parties = S.parties || []).push({ id:row.id, n:row.n || '', cur:row.cur || 'toman', c:[] });
  }
  else if(tb === 'c'){
    let old = null;
    (S.parties || []).forEach(par => {
      const i = (par.c || []).findIndex(x => String(x.id) === id);
      if(i >= 0){ old = par.c[i]; par.c.splice(i, 1); }
    });
    const par = (S.parties || []).find(x => String(x.id) === String(row.p));
    if(!par) return liveFallback();
    par.c = par.c || [];
    par.c.push({ id:row.id, n:row.n || '', ph:row.ph || '', ds:row.ds || '', pf:row.pf || '', ac:row.ac || '', tx: old ? old.tx : [] });
  }
  else if(tb === 't'){
    let cust = null;
    (S.parties || []).forEach(par => (par.c || []).forEach(c => {
      const i = (c.tx || []).findIndex(x => String(x.id) === id);
      if(i >= 0) c.tx.splice(i, 1);
      if(String(c.id) === String(row.c)) cust = c;
    }));
    if(!isDel){
      if(!cust) return liveFallback();
      cust.tx = cust.tx || [];
      cust.tx.push(txFromRow(row));
    }
  }
  else if(tb === 'l'){
    S.ledger = (S.ledger || []).filter(x => String(x.id) !== id);
    if(!isDel) S.ledger.push(ledgerFromRow(row));
  }

  /* وضعیت جدید این ردیف را به‌عنوان وضعیت سرور نگه می‌داریم */
  const newRow = isDel ? undefined : (cloudRowsFor(u)[tb] || []).find(r => String(r.id) === id);
  const newJ = newRow ? JSON.stringify(newRow) : undefined;
  if(newJ === prevJ) return;
  if(newJ === undefined) prev.delete(id); else prev.set(id, newJ);
  SYNC_SNAP[tb] = prev;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  liveScheduleRender();
}

async function liveRefresh(){
  if(!supabaseClient || !navigator.onLine) return;
  if(!cloudUser) await ensureCloudUser();
  if(!cloudUser) return;
  if(TOUCHING || Date.now() - TOUCH_T < 1500){ clearTimeout(LIVE_T); LIVE_T = setTimeout(liveRefresh, 1600); return; }
  /* اگر همین گوشی در حال ثبت است، کمی صبر می‌کنیم تا تغییر خودش گم نشود */
  if(WRITING || cloudSyncing || NBLOADING){ clearTimeout(LIVE_T); LIVE_T = setTimeout(liveRefresh, 1200); return; }
  /* وسط نوشتن در فرم یا باز بودن پنجره، صفحه را دست نمی‌زنیم */
  if(liveUIBusy()){ clearTimeout(LIVE_T); LIVE_T = setTimeout(liveRefresh, 2000); return; }
  try{
    await cloudLoad();
    await nbLoad();
    await prefLoadCloud();
    if(!LK.locked) render();
  }catch(e){ console.warn('live refresh:', e); }
}

async function initCloudSession(){
  nbFromCache();
  if(!supabaseClient){
    /* کتابخانه ابری در دسترس نیست (مثلاً آفلاین): اگر قبلاً وارد شده‌اید، با PIN و اطلاعات ذخیره‌شده باز شود */
    if(S.loggedIn && S.email){
      let su = false; try{ su = sessionStorage.getItem('hisab_unlocked') === '1'; }catch(e){}
      if(S.pin && !su){ LK.locked = true; LK.mode = 'unlock'; LK.buf = ''; LK.err = ''; LK.f.mail = S.email; renderLock(); render(); }
      else lkUnlock();
      return;
    }
    LK.locked = true; LK.err = 'اتصال Supabase بارگذاری نشد. اینترنت و آدرس پروژه را بررسی کنید.'; renderLock(); return;
  }
  const _gs = await withTimeoutSoft(supabaseClient.auth.getSession(), 8000);
  const data = _gs?.data, error = _gs?.error;
  let sessUser = data?.session?.user || null;
  if(!sessUser && navigator.onLine){ sessUser = await restoreSessBackup(); }
  /* اگر قبلاً وارد شده‌اید و PIN دارید، نشست ذخیره‌شده روی گوشی کافی است (حتی بدون اینترنت) */
  if(!sessUser && S.loggedIn && S.email) sessUser = storedSessionUser();
  if(error && !sessUser){ LK.locked = true; LK.err = 'خواندن نشست کاربری ناموفق بود.'; renderLock(); return; }
  if(!sessUser){
    cloudUser = null; cloudReady = false; LK.locked = true;
    const pr = recPending();
    if(pr){
      LK.mode = 'verify'; LK.purpose = 'recovery'; LK.buf = ''; LK.f.mail = pr.mail;
      LK.err = 'کُد ۸ رقمی ارسال‌شده به ایمیل را وارد کنید.';
    } else if(S.pin && S.email){
      LK.mode = 'unlock'; LK.buf = ''; LK.f.mail = S.email;
    } else {
      LK.mode = 'login'; LK.f.mail = '';
    }
    renderLock(); return;
  }
  cloudUser = sessUser; cloudReady = false;
  nbUseUser();
  S.loggedIn = true; delete S.passHash; delete S.reg;
  LK.f.mail = S.email || cloudUser.email || '';
  let stillUnlocked = false;
  try{ stillUnlocked = sessionStorage.getItem('hisab_unlocked') === '1'; }catch(e){}
  if(S.pin && !stillUnlocked){ LK.locked = true; LK.mode = 'unlock'; LK.buf = ''; LK.err = ''; renderLock(); render(); }
  else lkUnlock();
  /* اطلاعات ابری در پس‌زمینه خوانده می‌شود؛ اگر اینترنت نباشد، همان اطلاعات ذخیره‌شده نمایش داده می‌شود */
  refreshCloudQuiet();
}


/* ---- پشتیبان‌گیری: فایل در پوشهٔ دانلود ذخیره می‌شود ---- */
let BK_PANEL = '';
function showBackupAsk(){
  let d = document.getElementById('bk-dlg');
  if(!d){ d = document.createElement('div'); d.id = 'bk-dlg'; document.body.appendChild(d); }
  d.innerHTML = '<div onclick="if(event.target===this)closeBk()" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:flex-start;justify-content:center;padding:72px 16px 16px;box-sizing:border-box">'
    + '<div style="background:#fff;color:#1f2937;border-radius:18px;padding:18px;width:100%;max-width:420px;box-sizing:border-box;direction:rtl">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px;margin-bottom:12px"><span>پشتیبان‌گیری</span><button onclick="closeBk()" style="border:0;background:none;font-size:20px;cursor:pointer;color:#1f2937">✕</button></div>'
    + '<div style="background:#fff8e6;border:1px solid #e6c46a;border-radius:12px;padding:14px;line-height:2;font-size:15px">با تأیید، بکاپ‌گیری در پوشه دانلود انجام می‌شود.<br>برای بازیابی اطلاعات، از نسخه آفلاین استفاده کنید: در نسخه آفلاین، از تنظیمات گزینه «بازیابی از فایل پشتیبان» را بزنید و همین فایل را انتخاب کنید.</div>'
    + '<div style="display:flex;gap:8px;margin-top:14px"><button class="srow-b" onclick="runBackup()" style="flex:1">تأیید</button><button class="srow-b" onclick="closeBk()" style="flex:1">انصراف</button></div>'
    + '</div></div>';
}
function closeBk(){ const d = document.getElementById('bk-dlg'); if(d) d.innerHTML = ''; }
/* بستن پنل؛ اگر از دکمهٔ برگشت گوشی آمده باشد، دوباره history.back نمی‌زند */
function bkClose(fromPop){
  if(!BK_PANEL) return;
  BK_PANEL = '';
  if(!fromPop){ try{ history.back(); }catch(e){} }
  render();
}
window.addEventListener('popstate', () => { if(BK_PANEL) bkClose(true); });
function bkTimeTxt(now){
  const h = now.getHours();
  const h12 = (h % 12) || 12;
  const mi = String(now.getMinutes()).padStart(2, '0');
  return h12 + ':' + mi + ' ' + (h < 12 ? 'ق.ظ' : 'ب.ظ');
}
async function bkNotebooks(){
  /* یادداشت‌ها از سرور خوانده می‌شوند؛ اگر اینترنت نبود، نسخهٔ ذخیره‌شدهٔ همین حساب استفاده می‌شود */
  if(navigator.onLine && cloudUser){ try{ await nbLoad(); }catch(e){} }
  if(NB.length || NY.length) return { nb: NB, ny: NY };
  try{
    const c = JSON.parse(localStorage.getItem('hesab-nb-v1') || 'null');
    if(c && cloudUser && c.uid === cloudUser.id) return { nb: c.nb || [], ny: c.ny || [] };
  }catch(e){}
  return { nb: NB, ny: NY };
}
/* آخرین پشتیبان‌گیری: تاریخ شمسی و ساعت همان لحظه، ذخیره و نمایش داده می‌شود */
function onLastBackupTxt(){
  let iso = LAST_BK || null;
  if(!iso){ try{ iso = localStorage.getItem('hesab-last-backup'); }catch(e){} }
  if(!iso) return 'هنوز انجام نشده';
  const d = new Date(iso);
  if(isNaN(d)) return 'هنوز انجام نشده';
  const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const pv = t => (parts.find(x => x.type === t) || {}).value || '';
  const h = d.getHours(), h12 = (h % 12) || 12, mi = String(d.getMinutes()).padStart(2, '0');
  return pv('year') + '/' + pv('month') + '/' + pv('day') + ' ساعت ' + h12 + ':' + mi + ' ' + (h < 12 ? 'ق.ظ' : 'ب.ظ');
}
let BK_BUSY = false;
async function runBackup(){
  if(BK_BUSY) return;
  BK_BUSY = true;
  closeBk();
  try{
  let cnt = 0; try{ cnt = Number(localStorage.getItem('hesab-backup-count') || 0); localStorage.setItem('hesab-backup-count', String(cnt + 1)); }catch(e){}
  const n = (cnt % 10) + 1;   /* شماره‌ها ۱ تا ۱۰ و دوباره از ۱ */
  const now = new Date();
  const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { day:'numeric', month:'numeric', year:'numeric' }).formatToParts(now);
  const pv = t => (parts.find(x => x.type === t) || {}).value || '';
  /* ترتیب: سال-روز-ماه، مثل 1405-21-8 */
  const dateTxt = pv('year') + '-' + pv('day') + '-' + pv('month');
  const timeTxt = bkTimeTxt(now);
  const fname = 'daftari-' + pv('day') + '-' + pv('month') + '-' + pv('year') + '-' + ((now.getHours() % 12) || 12) + '꞉' + String(now.getMinutes()).padStart(2,'0') + '꞉' + String(now.getSeconds()).padStart(2,'0') + '.json';
  const nbData = await bkNotebooks();
  const payload = {
    app: 'hisab-backup', version: 1, created: now.toISOString(), backupNo: n,
    data: { cur: S.cur || 'toman', parties: S.parties || [], ledger: S.ledger || [] },
    notebooks: { nb: nbData.nb || [], ny: nbData.ny || [] }
  };
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  const bkAt = new Date().toISOString();
  LAST_BK = bkAt;
  try{ localStorage.setItem('hesab-last-backup', bkAt); }catch(e){}
  render();
  showToast('پکاپ گیری با موفقیت در پوشه دانلود انجام شد', true);
  /* ثبت زمان در سرور در پس‌زمینه انجام می‌شود و جلوی دانلود را نمی‌گیرد */
  if(supabaseClient && cloudUser && navigator.onLine){
    supabaseClient.from('s').update({ lbk: bkAt }).eq('u', cloudUser.id)
      .then(({ error }) => { if(error) console.warn('backup time save:', error); })
      .catch(e => console.warn('backup time save:', e));
  }
  }finally{ BK_BUSY = false; }
}

SUPA_READY.then(() => { if(supabaseClient){
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(session && session.access_token){ saveSessBackup(session); if(session.user) cloudUser = session.user; }
    /* خروج غیرمنتظره (مثلاً تازه‌سازی توکن ناموفق): اگر نسخهٔ پشتیبان هست، نشست برگردانده می‌شود */
    if(event === 'SIGNED_OUT'){ setTimeout(() => { restoreSessBackup().then(u => { if(u) cloudUser = u; }); }, 300); }
  });
} });
SUPA_READY.then(() => initCloudSession());
